<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>PubQuiz — Projector</title></head><body data-role="display"><div id="projection"><header><div><p class="eyebrow">QUIZ NIGHT</p><h1 id="title">PubQuiz</h1></div><span class="screen-controls"><button id="fullscreen" class="subtle" type="button">⛶ Full screen</button> <button id="enableSound" class="subtle" type="button">Enable buzzer sound</button> <span id="connection" role="status"></span></span></header><p id="message" role="status"></p><section id="projectQuestion" hidden><p id="round" class="eyebrow"></p><h2 id="question"></h2><p id="status" class="timer"></p><div id="media"></div><ol id="projectItems"></ol><div id="projectBingo" hidden><p id="bingoBig" class="bingo-big"></p><p id="bingoCallText" class="bingo-call"></p><p id="bingoWinners"></p><div id="bingoBoard" class="bingo-board"></div></div><div id="projectBuzz" hidden><p id="buzzLeader" class="buzz-leader"></p><p id="buzzDetail"></p></div><div id="solution"></div></section><section id="joinSection" hidden><h2 class="join-title">Join the quiz on your phone</h2><div class="join-steps"><figure><div id="wifiQr" class="qr"></div><figcaption><strong>1. Join the Wi-Fi</strong><span id="joinSsid" class="join-big"></span><span class="muted">Scan with your camera, or pick it in Wi-Fi settings. Stay connected if your phone says “no internet”.</span></figcaption></figure><figure><div id="urlQr" class="qr"></div><figcaption><strong>2. Open the quiz</strong><span id="joinUrl" class="join-big"></span><span class="muted">It may open by itself. If not, scan this or type the address.</span></figcaption></figure></div><p id="joinStatus" class="join-status"></p></section><section id="winnerSection" class="winner" hidden><div id="confetti" aria-hidden="true"></div><p class="eyebrow">AND THE WINNER IS…</p><div id="winnerPhotos" class="winner-photos"></div><h2 id="winnerName" class="winner-name"></h2><p id="winnerScore" class="winner-score"></p><ol id="podium" class="podium"></ol></section><section id="wheelSection" hidden><svg id="wheel" viewBox="-112 -112 224 224" role="img" aria-label="Spinning wheel"></svg><p id="wheelResult" class="buzz-leader"></p></section><section id="boardSection"><h2>Leaderboard</h2><p id="boardStatus"></p><ol id="leaderboard" class="leaderboard"></ol><p id="joinHint" class="muted"></p></section></div><script type="module" src="/client.js"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="/pages/pages.css"><link rel="icon" href="/brand/mark.svg" type="image/svg+xml"><title>Reset your password · BeerMat</title></head>
<body data-page="reset"><main><img class="logo" src="/brand/logo.svg" alt="BeerMat"><h1>Reset your password</h1>
<form id="ask" hidden><p>Enter your account’s email address and we’ll send you a link to choose a new password.</p><label>Email<input id="email" type="email" maxlength="200" autocomplete="username" required></label><button>Send me a link</button></form>
<form id="choose" hidden><label>New password (at least 10 characters)<input id="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label><label>Same again<input id="again" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label><button>Save new password</button></form>
<p id="status" role="status"></p></main><script type="module" src="/pages/pages.js"></script></body></html>

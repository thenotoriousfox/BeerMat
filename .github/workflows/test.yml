name: Offline quiz tests
# Once per change: on a pull request, and on main after a merge (not again for the branch's own push). Only when
# something these tests cover changed; docs and the website alone don't run them. Minutes count against the account's
# monthly allowance (Linux ×1, Windows ×2, macOS ×10), so each check runs only where it can find something.
on:
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'themes/**'
      - 'library/**'
      - 'sounds/**'
      - 'online/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'themes/**'
      - 'library/**'
      - 'sounds/**'
      - 'online/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The shared buzzer library converts clips with ffmpeg (as BeerMat Online's server does); runners lack it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/setup.sh scripts/start.sh scripts/connectivity.sh
      # Starting a hotspot needs NetworkManager and Wi-Fi, which runners lack; check the script loads.
      - run: python3 scripts/hotspot.py --help

name: Offline quiz tests
# By hand only (Actions → Run workflow): Actions minutes come from a small monthly allowance, every suite runs on the
# laptop before a merge, and the Release workflow runs these same tests before it builds.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The shared buzzer library converts clips with ffmpeg (as BeerMat Online's server does); runners lack it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n scripts/setup.sh scripts/start.sh scripts/connectivity.sh
      # Starting a hotspot needs NetworkManager and Wi-Fi, which runners lack; check the script loads.
      - run: python3 scripts/hotspot.py --help

name: Release desktop app
# Push a tag like v0.4.0 (matching package.json's version) to build the Windows and Linux apps and publish them as a
# GitHub release: https://github.com/DTJW92/PubQuiz/releases/latest. Run it by hand to build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
            files: |
              dist/*.AppImage
              dist/*.tar.gz
          - os: windows-latest
            dist: dist:win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # The build downloads its own copy of castlabs' Electron; the one npm installs is only for running from source.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')" || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      # npm 12, as the lockfile was made with: it reads .npmrc's allow-git and package.json's allowScripts.
      - run: npm install -g npm@12
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm test
      - run: npm run ${{ matrix.dist }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "PubQuiz $GITHUB_REF_NAME" --generate-notes
